id: p2-local-first-data-recovery
title: Build local-first readings data and recovery
summary: Implement durable on-phone storage, migrations, an outbox, honest save and backup states, and loss-resistant recovery using synthetic fixtures only.
status: in-progress
branch: aloeil/p2-local-first-data-recovery
base_branch: dev
dependencies:
  - p0-product-privacy-brief
blockers:
  - Representative-device accessibility and fresh-profile recovery validation remain.
  - Residual SQLite metadata privacy and backup destination decisions remain.
scope:
  - local encrypted database and schema migrations
  - immutable reading identifiers and sitting identifiers
  - offline-first save and retryable outbox
  - explicit export and restore verification
  - conflict handling that never deletes a local row because a replica is empty or unavailable
non_goals:
  - production hosting, real readings, diagnosis, treatment advice, analytics, public signup, or caregiver sharing
acceptance:
  - Saving never waits for the network and survives process restart.
  - Migration and restore tests prove that synthetic history is preserved.
  - UI state distinguishes saved on phone from backup copy confirmed.
  - An unavailable or empty replica cannot erase local records.
write_paths:
  - app/
  - docs/architecture/
  - .github/workflows/
  - gradle/
  - gradlew
  - gradlew.bat
  - gradle.properties
  - settings.gradle.kts
  - build.gradle.kts
  - .gitignore
  - README.md
  - .speculoos/tasks/p2-local-first-data-recovery.yaml
  - .speculoos/manifest.yaml
  - .speculoos/surfaces/github.yaml
validation:
  - ./gradlew --no-daemon :app:testSyntheticDebugUnitTest :app:pixel2api30DebugAndroidTest
  - git diff --check
executor: codex-only
branch_plan: complete local data and recovery on the GCP-authored PR against dev; keep pilot and real readings gated
private_data_scan: required before publication
publish_authority: operator-approved implementation go; external writes remain exact-head review gated
