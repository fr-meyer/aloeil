name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Eclipse Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run JVM and Android database tests
        run: ./gradlew --no-daemon :app:testSyntheticDebugUnitTest :app:pixel2api30DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Compile unsigned release and run release lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: Build synthetic device-validation APK and checksum
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cd ../androidTest/debug
          sha256sum app-debug-androidTest.apk > app-debug-androidTest.apk.sha256

      - name: Upload synthetic device-validation APK
        uses: actions/upload-artifact@v4
        with:
          name: aloeil-synthetic-validation-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Regenerate and record compiler-generated Room v3 schema
        run: |
          set -euo pipefail
          git ls-files --error-unmatch app/schemas/org.aloeil.app.data.ReadingDatabase/3.json > /dev/null
          rm -f app/schemas/org.aloeil.app.data.ReadingDatabase/3.json
          ./gradlew --no-daemon --no-build-cache --rerun-tasks -Pksp.incremental=false :app:kspReleaseKotlin
          git diff --exit-code HEAD -- app/schemas/org.aloeil.app.data.ReadingDatabase/3.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          schema_path = pathlib.Path("app/schemas/org.aloeil.app.data.ReadingDatabase/3.json")
          payload = schema_path.read_bytes()
          schema = json.loads(payload)
          database = schema["database"]
          if database["version"] != 3 or not database["identityHash"] or not database["entities"]:
              raise ValueError("Expected the compiler-generated ReadingDatabase v3 schema")
          digest = hashlib.sha256(payload).hexdigest()
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if checkout != os.environ["GITHUB_SHA"]:
              raise ValueError("Checkout does not match this Actions event")
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event.get("pull_request")
          inputs = ["app/src/main/kotlin/org/aloeil/app/data/ReadingDatabase.kt", "app/build.gradle.kts",
                    "gradle/libs.versions.toml", "gradle/wrapper/gradle-wrapper.properties"]
          provenance = {
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "checkout_sha": checkout,
              "checkout_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "head_sha": pr["head"]["sha"] if pr else checkout,
              "base_sha": pr["base"]["sha"] if pr else None,
              "schema_path": str(schema_path), "schema_sha256": digest,
              "database_version": database["version"], "identity_hash": database["identityHash"],
              "table_names": sorted(entity["tableName"] for entity in database["entities"]),
              "generation_command": "./gradlew --no-daemon --no-build-cache --rerun-tasks -Pksp.incremental=false :app:kspReleaseKotlin",
              "source_sha256": {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in inputs},
          }
          output = pathlib.Path("app/build/room-schema-evidence")
          output.mkdir(parents=True, exist_ok=True)
          (output / "3.json").write_bytes(payload)
          (output / "3.json.sha256").write_text(f"{digest}  3.json\n")
          (output / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          print(f"Retained compiler schema v3: {digest}; checkout: {checkout}")
          PY

      - name: Upload compiler-generated Room v3 schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: aloeil-room-schema-v3
          path: |
            app/build/room-schema-evidence/3.json
            app/build/room-schema-evidence/3.json.sha256
            app/build/room-schema-evidence/provenance.json
          if-no-files-found: error
          retention-days: 14
